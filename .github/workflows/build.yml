name: Check

# Required pull-request quality gate. The repository has lint, unit/content
# tests and a production build, so CI runs the same `npm run check` command
# contributors use locally instead of validating compilation only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run check
